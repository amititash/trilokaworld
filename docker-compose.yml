
services:
  triloka-backend:
    build: ./backend
    container_name: triloka-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      SEARCH_SERVICE_URL: http://triloka-search:8000
      FRONTEND_URL: ${FRONTEND_URL}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      USE_FAKE_AUTH: ${USE_FAKE_AUTH}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
    depends_on:
      - triloka-search
    networks:
      - app-network

  triloka-search:
    build: ./search
    container_name: triloka-search
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./search:/app
      - chroma_data:/app/chroma_off
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - ./search/.env
    environment:
      DEV: ${DEV:-false}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_API_URL: ${NODE_API_URL:-http://triloka-backend:5000}
      PORTKEY_API_KEY: ${PORTKEY_API_KEY}
      PORTKEY_CONFIG: ${PORTKEY_CONFIG}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      ANONYMIZED_TELEMETRY: "False"
      CHROMA_TELEMETRY: "False"
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_TIMEOUT: "300"
      HF_HUB_READ_TIMEOUT: "300"
    command: >
      sh -c "
      if [ \"$$DEV\" = \"true\" ]; then
        uvicorn api:app --host 0.0.0.0 --port 8000 --reload;
      else
        uvicorn api:app --host 0.0.0.0 --port 8000;
      fi
      "
    networks:
      - app-network

volumes:
  chroma_data:
  huggingface_cache:

networks:
  app-network:
    driver: bridge
